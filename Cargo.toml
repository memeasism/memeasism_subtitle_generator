[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
incremental = false

[package]
name = "memeasism_subtitle_generator"
version = "0.4.0"
edition = "2024"
build = "build.rs"

[dependencies]
arboard = {version = "3.7.0", default-features = false}
rc-cell = "0.1.0"
maudio = "0.1.10"
slint = "1.18.1"

[target.'cfg(windows)'.dependencies]
windows = {version = "0.62.2", features = ["Win32_System_Com"] }


[build-dependencies]
slint-build = "1.18.1"
winres = "0.1.12"